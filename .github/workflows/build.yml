name: Build MaxOS GSI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'maxos/**', '.github/workflows/build.yml' ]

env:
  BASE_BRANCH: "16.0"
  TREBLE_MANIFEST_BRANCH: "android-16.0"
  LUNCH_TARGET: "treble_arm64_bvN-userdebug"

jobs:
  sync:
    name: "sync ${{ matrix.chunk }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        chunk: [core, frameworks, external, packages, system-vendor, prebuilts, misc]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /etc/mysql /etc/php /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs zstd curl python3
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "maxos-builder"
          git config --global user.email "builder@maxos.local"
          git lfs install

      - name: Compute this chunk's project list
        run: |
          python3 << 'EOF'
          import urllib.request, re
          import xml.etree.ElementTree as ET

          CRDROID_BASE = 'https://raw.githubusercontent.com/crdroidandroid/android/16.0/'

          def fetch_text(url):
              return urllib.request.urlopen(url).read().decode()

          def parse_projects(xml_text):
              """Proper XML parse: handles multi-line <project> tags with children,
              ignores comments, collects path+name."""
              out = []
              root = ET.fromstring(xml_text)
              for e in root.iter('project'):
                  p, n = e.get('path'), e.get('name')
                  if p and n:
                      out.append((p, n))
              return out

          def collect_manifest(url, depth=0, seen=None):
              """Follow <include> elements recursively."""
              if seen is None:
                  seen = set()
              if url in seen or depth > 6:
                  return []
              seen.add(url)
              text = fetch_text(url)
              projects = parse_projects(text)
              root = ET.fromstring(text)
              for inc in root.iter('include'):
                  inc_name = inc.get('name')
                  if inc_name:
                      projects += collect_manifest(CRDROID_BASE + inc_name, depth + 1, seen)
              return projects

          all_projects = collect_manifest(CRDROID_BASE + 'default.xml')
          all_projects += parse_projects(fetch_text(
              'https://raw.githubusercontent.com/TrebleDroid/treble_manifest/android-16.0/manifest.xml'))

          # respect TrebleDroid remove.xml: those projects must NOT be synced
          rem_xml = fetch_text('https://raw.githubusercontent.com/TrebleDroid/treble_manifest/android-16.0/remove.xml')
          removed_names = set(re.findall(r'<remove-project\s+name="([^"]+)"', rem_xml))
          all_projects = [(p, n) for (p, n) in all_projects if n not in removed_names]

          def slim_keep(path):
              if path.startswith(('device/', 'kernel/')) and not path.startswith(('device/phh', 'device/generic')):
                  return False
              if path.startswith('vendor/') and not path.startswith(('vendor/lineage', 'vendor/support', 'vendor/crdroid')):
                  return False
              if path.startswith(('test/cts', 'test/vts', 'test/sts', 'test/suite_harness', 'test/mts')):
                  return False
              if path.startswith(('prebuilts/gcc', 'prebuilts/abi-dumps', 'prebuilts/ndk', 'prebuilts/devguide')):
                  return False
              if path.startswith(('hardware/qcom', 'hardware/ril', 'developers/', 'pdk')):
                  return False
              return True

          chunks = {
              'core':          ('art', 'bionic', 'bootable', 'build', 'dalvik', 'development',
                                'libcore', 'libnativehelper', 'device', 'tools', 'test'),
              'frameworks':    ('frameworks',),
              'external':      ('external',),
              'packages':      ('packages',),
              'system-vendor': ('system', 'hardware', 'vendor'),
              'prebuilts':     ('prebuilts',),
          }

          chunk = '${{ matrix.chunk }}'
          if chunk == 'misc':
              assigned = set()
              for prefixes in chunks.values():
                  assigned.update(prefixes)
              paths = [p for (p, n) in all_projects
                       if slim_keep(p) and not p.startswith(tuple(assigned))]
          else:
              prefixes = chunks[chunk]
              paths = [p for (p, n) in all_projects
                       if slim_keep(p) and p.startswith(prefixes)]

          seen, uniq = set(), []
          for p in paths:
              if p not in seen:
                  seen.add(p); uniq.append(p)

          # hard sanity: critical projects must exist somewhere
          critical = ['build/make', 'build/soong', 'device/phh/treble', 'vendor/lineage', 'frameworks/base']
          assigned_all = [p for (p, n) in all_projects if slim_keep(p)]
          missing = [c for c in critical if c not in assigned_all]
          if missing:
              raise SystemExit(f'CRITICAL projects missing from slim list: {missing}')

          with open('/home/runner/paths.txt', 'w') as f:
              f.write('\n'.join(uniq))
          print(f'chunk {chunk}: {len(uniq)} projects')
          for p in uniq[:10]:
              print('  ', p)
          EOF

      - name: Sync chunk
        run: |
          mkdir -p ~/android
          cd ~/android
          ~/bin/repo init -u https://github.com/crdroidandroid/android.git -b $BASE_BRANCH --depth=1 --git-lfs
          git clone https://github.com/TrebleDroid/treble_manifest .repo/local_manifests -b $TREBLE_MANIFEST_BRANCH --depth=1
          sed -i 's/<remote name="github" fetch="https:\/\/github.com\/" \/>/<remote name="maxosgh" fetch="https:\/\/github.com\/" \/>/; s/remote="github"/remote="maxosgh"/g' .repo/local_manifests/manifest.xml
          sed -i 's/<remove-project /<remove-project optional="true" /' .repo/local_manifests/remove.xml
          rm -f .repo/local_manifests/replace.xml
          ~/bin/repo sync -c -j4 --no-clone-bundle --no-tags --fail-fast $(cat /home/runner/paths.txt | tr '\n' ' ')
          df -h

      - name: Pack chunk (zstd, no .repo)
        run: |
          cd ~
          tar -c -I 'zstd -T0 -3' --exclude='android/.repo' -f chunk-${{ matrix.chunk }}.tar.zst android
          ls -lh chunk-${{ matrix.chunk }}.tar.zst

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: /home/runner/chunk-${{ matrix.chunk }}.tar.zst
          retention-days: 3
          compression-level: 0

  build:
    name: "Part 2: MaxOS build"
    needs: sync
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /etc/mysql /etc/php /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev git-lfs python3 zstd xz-utils
          git config --global user.name "maxos-builder"
          git config --global user.email "builder@maxos.local"
          git lfs install

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          path: /home/runner/chunks

      - name: Assemble tree
        run: |
          mkdir -p ~/android
          for c in core frameworks external packages system-vendor prebuilts misc; do
            if [ -f "/home/runner/chunks/chunk-$c/chunk-$c.tar.zst" ]; then
              echo "extracting chunk-$c"
              tar -x -I 'zstd -T0' -f "/home/runner/chunks/chunk-$c/chunk-$c.tar.zst" -C ~
            else
              echo "chunk-$c missing!"
              exit 1
            fi
          done
          ls ~/android/device/phh/treble/generate.sh && echo "[MaxOS] tree assembled correctly"
          du -sh ~/android
          df -h

      - name: Apply MaxOS layer + generate targets
        run: |
          cd ~/android
          mkdir -p device/maxos
          cp -r $GITHUB_WORKSPACE/maxos/* device/maxos/
          rm -f device/*/sepolicy/common/private/genfs_contexts || true
          cd device/phh/treble
          bash generate.sh device/phh/treble/lineage.mk device/maxos/maxos.mk
          ls treble_arm64_bvN.mk && echo "[MaxOS] target generated"

      - name: Build system image
        run: |
          cd ~/android
          # preflight: fail fast with a clear message if something critical is missing
          test -f build/envsetup.sh && echo "[MaxOS] envsetup OK" \
            || { echo "[MaxOS] FAIL: build/envsetup.sh missing"; exit 1; }
          test -f frameworks/base/Android.bp && echo "[MaxOS] frameworks/base OK" \
            || { echo "[MaxOS] FAIL: frameworks/base missing"; exit 1; }
          source build/envsetup.sh
          lunch $LUNCH_TARGET
          make WITHOUT_CHECK_API=true -j$(nproc) systemimage
          df -h

      - name: Package image
        run: |
          IMG=$(find ~/android/out/target/product -name system.img | head -1)
          xz -c "$IMG" -T0 > /home/runner/maxos-1.0-arm64-ab.img.xz
          ls -lh /home/runner/maxos-1.0-arm64-ab.img.xz

      - name: Upload MaxOS image
        uses: actions/upload-artifact@v4
        with:
          name: maxos-1.0-arm64-ab
          path: /home/runner/maxos-1.0-arm64-ab.img.xz
          compression-level: 0

name: Build MaxOS GSI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'maxos/**', '.github/workflows/build.yml' ]

env:
  BASE_BRANCH: "16.0"
  TREBLE_MANIFEST_BRANCH: "android-16.0"
  LUNCH_TARGET: "treble_arm64_bvN-userdebug"

jobs:
  sync:
    name: "Part 1: slim sync"
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /etc/mysql /etc/php /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs zstd curl python3
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "maxos-builder"
          git config --global user.email "builder@maxos.local"
          git lfs install

      - name: Generate slim manifest (drop OEM device/kernel/vendor trees)
        run: |
          python3 << 'EOF'
          import urllib.request, re
          xml = urllib.request.urlopen('https://raw.githubusercontent.com/crdroidandroid/android/16.0/default.xml').read().decode()
          tags = re.findall(r'<project\b[^>]*/>', xml)
          drop = []
          for tag in tags:
              pm = re.search(r'path="([^"]+)"', tag)
              nm = re.search(r'name="([^"]+)"', tag)
              if not pm or not nm:
                  continue
              path, name = pm.group(1), nm.group(1)
              if path.startswith(('device/', 'kernel/')) and not path.startswith(('device/phh', 'device/generic')):
                  drop.append(name)
              elif path.startswith('vendor/') and not path.startswith(('vendor/lineage', 'vendor/support', 'vendor/crdroid')):
                  drop.append(name)
          with open('/home/runner/maxos-slim.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n<manifest>\n')
              for name in sorted(set(drop)):
                  f.write(f'  <remove-project name="{name}" optional="true" />\n')
              f.write('</manifest>\n')
          print(f'MaxOS slim manifest: {len(set(drop))} projects dropped')
          EOF

      - name: Sync slim tree
        run: |
          mkdir -p /mnt/android
          cd /mnt/android
          ~/bin/repo init -u https://github.com/crdroidandroid/android.git -b $BASE_BRANCH --depth=1 --git-lfs
          git clone https://github.com/TrebleDroid/treble_manifest .repo/local_manifests -b $TREBLE_MANIFEST_BRANCH --depth=1
          sed -i 's/<remote name="github" fetch="https:\/\/github.com\/" \/>/<remote name="maxosgh" fetch="https:\/\/github.com\/" \/>/; s/remote="github"/remote="maxosgh"/g' .repo/local_manifests/manifest.xml
          sed -i 's/<remove-project /<remove-project optional="true" /' .repo/local_manifests/remove.xml
          rm -f .repo/local_manifests/replace.xml
          cp /home/runner/maxos-slim.xml .repo/local_manifests/maxos-slim.xml
          ~/bin/repo sync -c -j4 --no-clone-bundle --no-tags --fail-fast
          df -h

      - name: Pack tree (zstd)
        run: |
          cd /mnt
          tar -c -I 'zstd -T0 -3' -f android-tree.tar.zst android
          ls -lh android-tree.tar.zst

      - name: Upload tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-tree
          path: /mnt/android-tree.tar.zst
          retention-days: 3
          compression-level: 0

  build:
    name: "Part 2: MaxOS build"
    needs: sync
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /etc/mysql /etc/php /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev git-lfs python3 zstd xz-utils
          git config --global user.name "maxos-builder"
          git config --global user.email "builder@maxos.local"
          git lfs install

      - name: Download tree
        uses: actions/download-artifact@v4
        with:
          name: android-tree
          path: /mnt

      - name: Extract tree
        run: |
          cd /mnt
          tar -x -I 'zstd -T0' -f android-tree.tar.zst
          rm -f android-tree.tar.zst
          df -h

      - name: Apply MaxOS layer + generate targets
        run: |
          cd /mnt/android
          mkdir -p device/maxos
          cp -r $GITHUB_WORKSPACE/maxos/* device/maxos/
          rm -f device/*/sepolicy/common/private/genfs_contexts || true
          bash device/phh/treble/generate.sh device/phh/treble/lineage.mk device/maxos/maxos.mk
          ls device/phh/treble/treble_arm64_bvN.mk && echo "[MaxOS] target generated"

      - name: Build system image
        run: |
          cd /mnt/android
          export OUT_DIR=$HOME/out
          source build/envsetup.sh
          lunch $LUNCH_TARGET
          make WITHOUT_CHECK_API=true -j$(nproc) systemimage
          df -h

      - name: Package image
        run: |
          IMG=$(find $HOME/out/target/product -name system.img | head -1)
          xz -c "$IMG" -T0 > /mnt/maxos-1.0-arm64-ab.img.xz
          ls -lh /mnt/maxos-1.0-arm64-ab.img.xz

      - name: Upload MaxOS image
        uses: actions/upload-artifact@v4
        with:
          name: maxos-1.0-arm64-ab
          path: /mnt/maxos-1.0-arm64-ab.img.xz
          compression-level: 0
